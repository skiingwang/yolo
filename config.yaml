DEVICE: cuda

MODEL:
  SPLIT_SIZE: 13
  NUM_BOXES: 5
  NUM_CLASSES: 10

TRAIN:
  LEARNING_RATE: 0.001
  NUM_EPOCH: 100
  BATCH_SIZE: 16

INFERENCE:
  CONFIDENCE_THRESHOLD: 0.4
  IOU_THRESHOLD: 0.6

LOSS:
  LAMBDA_COORD: 1
  LAMBDA_OBJ: 5
  LAMBDA_NOOBJ: 0.5
  LAMBDA_CLASS: 1
  LAMBDA_PRIOR: 0.01

DATASET:
  PATH: './data/Drink_284_Detection'
